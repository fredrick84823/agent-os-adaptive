# aoa-eval 的評估對象：每個 repo 釘在一個 commit，標註（ground_truth/<name>.jsonl）只對這個 commit 有效。
# 換 commit 就要重新檢查標註；aoa-eval 遇到標註的路徑不在圖上會直接報錯。

[defaults]
stability_commits = 4   # 往前取幾個 first-parent commit 算相鄰 commit 的分類 churn
replay_days = 365       # 歷史回放：在「pinned commit 時間 − N 天」的 commit 分類，再看之後的 bug-fix commit

