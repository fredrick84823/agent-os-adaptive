[project]
name = "aoa-graph"
version = "0.1.0"
description = "Deterministic file-level dependency graph and metrics for TS/JS and Python repos (tree-sitter), used by agent-os-adaptive's analyze-node-classes."
readme = "tools/aoa_graph/README.md"
requires-python = ">=3.10"
# 版本固定，確保同一個 commit 的輸出位元相同。
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[project.scripts]
aoa-graph = "aoa_graph.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/aoa_graph"]
